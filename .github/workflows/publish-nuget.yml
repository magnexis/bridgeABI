name: Publish NuGet package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version (for example 0.1.0-preview.3)"
        required: true
        type: string
      publish:
        description: "Push the validated package to NuGet.org"
        required: true
        default: false
        type: boolean
permissions:
  contents: read

jobs:
  package:
    name: Build, test, and package (Windows x64)
    runs-on: windows-2022
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Derive package version from published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+') {
            throw "Release tag '$env:RELEASE_TAG' must begin with a NuGet-compatible v<major>.<minor>.<patch> version."
          }
          "PACKAGE_VERSION=$($env:RELEASE_TAG.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and test BridgeABI
        shell: pwsh
        run: |
          cmake -S . -B build -DBRIDGEABI_BUILD_TESTS=ON
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - name: Create NuGet package
        shell: pwsh
        run: ./scripts/pack-nuget.ps1 -Configuration Release -Version $env:PACKAGE_VERSION

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeABI.Native.${{ env.PACKAGE_VERSION }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NUGET_API_KEY is required to publish."
          }
          dotnet nuget push artifacts/nuget/*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
